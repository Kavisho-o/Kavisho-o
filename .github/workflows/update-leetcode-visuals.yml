name: Update LeetCode Visuals

on:
  schedule:
    # Every 6 hours
    - cron: "17 */6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-leetcode-visuals.yml"

permissions:
  contents: write

concurrency:
  group: leetcode-visuals
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate SVG assets
        env:
          LEETCODE_USERNAME: ${{ vars.LEETCODE_USERNAME || 'Kavish0_0' }}
        run: node scripts/generate-all.mjs

      - name: Commit updated assets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh LeetCode visuals [skip ci]"
          file_pattern: "assets/*.svg"
          commit_user_name: "leetcode-viz-bot"
          commit_user_email: "actions@users.noreply.github.com"
